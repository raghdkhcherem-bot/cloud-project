<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><div class="top"><div class="brand">🌿 PME Naturelle</div><nav id="nav"></nav></div>
<div class="hero"><h1>Notifications</h1><p>Historique des messages envoyés aux clients, mis à jour automatiquement</p></div></header>
<main>
  <div class="stats"><div class="stat"><b id="n">0</b><small>notifications</small></div>
  <div class="stat"><b id="live">●</b><small id="upd">en attente...</small></div></div>
  <div id="list"></div>
</main>
<footer>Microservice Notifications · port 5003</footer>
<script>
const SERVICES=[["Catalogue",5001],["Commandes",5002],["Notifications",5003]], ME=5003;
document.getElementById("nav").innerHTML=SERVICES.map(([n,p])=>`<a class="${p===ME?"active":""}" href="http://${location.hostname}:${p}/">${n}</a>`).join("");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function load(){fetch("/notifications").then(r=>r.json()).then(l=>{
  document.getElementById("n").textContent=l.length;
  document.getElementById("live").style.color="#16a34a";
  document.getElementById("upd").textContent="mis à jour à "+new Date().toLocaleTimeString("fr-FR");
  document.getElementById("list").innerHTML=l.slice().reverse().map(n=>`
   <div class="notif"><div class="ico">✉️</div><div><b>Commande #${esc(n.order_id)}</b> · ${esc(n.customer_email)}<br>${esc(n.message)}<br><small>Notification #${esc(n.id)}</small></div></div>`).join("")
   ||'<div class="empty">Aucune notification pour le moment</div>'})
  .catch(()=>{document.getElementById("live").style.color="#dc2626";document.getElementById("upd").textContent="service injoignable"})}
load(); setInterval(load,4000);
</script></body></html>
